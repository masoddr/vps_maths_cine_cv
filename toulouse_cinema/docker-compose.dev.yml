version: '3.8'

services:
  frontend_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      # Mount source code for hot-reload
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    ports:
      - "3001:3000"
    command: npm run dev
    stdin_open: true
    tty: true
    networks:
      - dev_network

networks:
  dev_network:
    driver: bridge
